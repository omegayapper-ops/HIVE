<style>:root{--bg:#E3EED4;--bg2:#AEC3B0;--cd:rgba(255,255,255,.55);--tx:#0F2A1D;--mu:#375534;--ne:#0a9f63;--ne2:#12b5a0;--bt:#fff;--bd:rgba(15,42,29,.15);--rd:#d6334a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

.amb i:nth-child(2){background:var(--ne2);left:auto;right:-14vmax;top:30%;animation-duration:28s}.amb i:nth-child(3){background:#375534;left:22%;top:auto;bottom:-26vmax;animation-duration:34s}
.amb::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--bd) 1px,transparent 1px),linear-gradient(90deg,var(--bd) 1px,transparent 1px);background-size:44px 44px;opacity:.55;-webkit-mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent);mask-image:radial-gradient(70% 60% at 50% 30%,#000,transparent)}
@keyframes fl{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.ic{width:20px;height:20px;flex:none;filter:drop-shadow(0 0 4px color-mix(in srgb,var(--ne) 70%,transparent))}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;display:flex;align-items:center;gap:12px;padding:12px 20px;background:color-mix(in srgb,var(--bg) 70%,transparent);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.top>.ic{width:30px;height:30px;color:var(--ne)}.sp{flex:1}
.bn{font-weight:600;letter-spacing:.04em}.bn b,h1 b{background:linear-gradient(90deg,var(--ne),var(--ne2));-webkit-background-clip:text;background-clip:text;color:transparent}
.live{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mu)}.live i{width:8px;height:8px;border-radius:50%;background:var(--ne);box-shadow:0 0 10px var(--ne);animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.3;transform:scale(.7)}}
.chip2{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid var(--bd);border-radius:99px;color:var(--ne)}.chip2 small{color:var(--mu)}

.tab.on,.chip.on{border-color:var(--ne);color:var(--ne);box-shadow:0 0 16px -4px var(--ne),inset 0 0 12px -6px var(--ne)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:0;background:linear-gradient(135deg,var(--ne),var(--ne2));color:var(--bt);padding:9px 18px;border-radius:12px;cursor:pointer;font-weight:600;transition:.2s}.btn:hover{box-shadow:0 0 22px -2px var(--ne);transform:translateY(-1px)}

.hero{height:150px;border-radius:12px;margin-bottom:12px;display:grid;place-items:center;color:var(--ne);position:relative;overflow:hidden;background:linear-gradient(135deg,color-mix(in srgb,var(--ne) 22%,transparent),color-mix(in srgb,var(--ne2) 8%,transparent))}

table{width:100%;border-collapse:collapse;font-size:14px;margin-top:6px}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--bd)}th{color:var(--mu);font-weight:500}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--bd);border-radius:12px;background:color-mix(in srgb,var(--bg) 60%,transparent);margin:4px 0 10px;transition:.2s}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--ne);box-shadow:0 0 0 3px color-mix(in srgb,var(--ne) 22%,transparent)}
label{color:var(--mu);font-size:13px}.err{color:var(--rd);min-height:20px;font-size:13px}.al{border-left:3px solid var(--rd)}
