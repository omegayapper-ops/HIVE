<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#EAF8F1">
  <meta name="color-scheme" content="light dark">
  <meta http-equiv="refresh" content="4;url=ecopoints.html">
  <title>Opening Eco Points</title>
  <meta name="description" content="Opening Eco Points — small actions, shared impact.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{
      color-scheme:light;
      --bg:#edf9f3; --bg2:#e9f6fc; --ink:#123a32; --muted:#5d7d75;
      --line:rgba(38,119,97,.16); --panel:rgba(255,255,255,.72);
      --green:#16866a; --green2:#57c5a0; --sky:#82d3ec; --pink:#efbfd4;
      --shadow:0 30px 100px rgba(27,95,76,.15);
    }
    html[data-theme="dark"]{
      color-scheme:dark; --bg:#10231f; --bg2:#132b39; --ink:#e9fff6; --muted:#a5c8bb;
      --line:rgba(168,229,205,.16); --panel:rgba(18,43,38,.74);
      --green:#6de0b6; --green2:#2ba982; --sky:#72cde8; --pink:#e2a5c2;
      --shadow:0 30px 100px rgba(0,0,0,.28);
    }
    *{box-sizing:border-box}
    html,body{margin:0;min-height:100%;font-family:'DM Sans',system-ui,sans-serif;color:var(--ink)}
    body{min-height:100svh;overflow:hidden;display:grid;place-items:center;isolation:isolate;position:relative;
      background:radial-gradient(ellipse at 18% 15%,color-mix(in srgb,var(--sky) 39%,transparent),transparent 43%),
      radial-gradient(ellipse at 83% 20%,color-mix(in srgb,var(--pink) 38%,transparent),transparent 40%),
      radial-gradient(ellipse at 50% 100%,color-mix(in srgb,var(--green2) 25%,transparent),transparent 48%),linear-gradient(135deg,var(--bg),var(--bg2));}
    .eco-grid{position:absolute;inset:0;width:100%;height:100%;color:var(--green);opacity:.16;pointer-events:none;z-index:-1;mask-image:linear-gradient(110deg,transparent 0%,#000 20%,#000 80%,transparent 100%)}
    .ambient{position:absolute;width:min(46vw,430px);aspect-ratio:1;border-radius:50%;filter:blur(40px);opacity:.25;pointer-events:none;z-index:-1;animation:ambientDrift 8s ease-in-out infinite alternate}
    .ambient.a{background:var(--sky);top:-18%;left:-9%}.ambient.b{background:var(--pink);right:-12%;bottom:-23%;animation-delay:-3.5s}
    .shell{width:min(92vw,520px);padding:clamp(25px,5vw,44px);border:1px solid var(--line);border-radius:32px;text-align:center;position:relative;overflow:hidden;background:var(--panel);backdrop-filter:blur(24px) saturate(1.25);-webkit-backdrop-filter:blur(24px) saturate(1.25);box-shadow:var(--shadow);animation:cardRise .8s cubic-bezier(.18,.76,.25,1) both}
    .shell:before{content:"";height:1px;position:absolute;left:14%;right:14%;top:0;background:linear-gradient(90deg,transparent,var(--sky),var(--green2),var(--pink),transparent);opacity:.85}
    .micro-label{font-size:10px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:center;align-items:center;gap:9px}
    .micro-label:before,.micro-label:after{content:"";width:20px;height:1px;background:var(--line)}
    .visual{height:230px;display:grid;place-items:center;position:relative;margin:0 auto 3px;perspective:900px;isolation:isolate}
    .halo{position:absolute;width:184px;height:184px;border-radius:50%;border:1px solid color-mix(in srgb,var(--green) 29%,transparent);box-shadow:inset 0 0 34px color-mix(in srgb,var(--green2) 12%,transparent),0 0 36px color-mix(in srgb,var(--sky) 15%,transparent);transform:rotateX(65deg) rotateZ(-17deg);animation:haloSpin 11s linear infinite}
    .halo.h2{width:218px;height:218px;border-color:color-mix(in srgb,var(--pink) 44%,transparent);transform:rotateX(65deg) rotateZ(40deg);animation:haloSpin 15s linear infinite reverse}
    .halo.h3{width:160px;height:160px;border-style:dashed;border-color:color-mix(in srgb,var(--sky) 58%,transparent);transform:rotateX(72deg) rotateZ(0deg);animation:haloSpin 22s linear infinite}
    .node{position:absolute;width:10px;height:10px;border-radius:50%;background:linear-gradient(145deg,#fff,var(--green2));box-shadow:0 0 0 5px color-mix(in srgb,var(--green2) 14%,transparent),0 0 18px color-mix(in srgb,var(--green2) 55%,transparent);top:22px;left:50%;animation:nodeFloat 3.5s ease-in-out infinite}
    .node.n2{top:auto;left:auto;right:61px;bottom:45px;background:linear-gradient(145deg,#fff,var(--pink));box-shadow:0 0 0 5px color-mix(in srgb,var(--pink) 17%,transparent),0 0 18px color-mix(in srgb,var(--pink) 55%,transparent);animation-delay:-1.1s}
    .node.n3{top:72px;left:57px;background:linear-gradient(145deg,#fff,var(--sky));box-shadow:0 0 0 5px color-mix(in srgb,var(--sky) 16%,transparent),0 0 18px color-mix(in srgb,var(--sky) 50%,transparent);animation-delay:-2s}
    .core-float{width:126px;height:140px;position:relative;display:grid;place-items:center;transform-style:preserve-3d;animation:coreFloat 4.4s ease-in-out infinite}
    .core-shadow{position:absolute;width:96px;height:24px;border-radius:50%;bottom:1px;left:15px;background:color-mix(in srgb,var(--green) 19%,transparent);filter:blur(10px);transform:rotateX(72deg) translateZ(-22px);animation:shadowPulse 4.4s ease-in-out infinite}
    .hex-stack{position:absolute;width:112px;height:124px;clip-path:polygon(50% 0%,92% 23%,92% 73%,50% 100%,8% 73%,8% 23%);background:linear-gradient(135deg,#dff8ea 0%,#88d7b7 24%,#2f9f7e 52%,#146d58 80%,#bdebd7 100%);filter:drop-shadow(0 21px 22px rgba(19,96,73,.25));transform:translateZ(-7px) rotateY(-12deg);}
    .hex-stack:before{content:"";position:absolute;inset:10px;background:linear-gradient(135deg,rgba(255,255,255,.72),rgba(255,255,255,.08) 48%,rgba(9,80,62,.28));clip-path:inherit;border:1px solid rgba(255,255,255,.55)}
    .hex-stack.back{width:96px;height:108px;transform:translate(15px,11px) translateZ(-21px) rotateY(11deg);opacity:.52;background:linear-gradient(145deg,var(--sky),var(--pink) 70%,var(--green2));}
    .hex-face{position:absolute;width:92px;height:103px;display:grid;place-items:center;clip-path:polygon(50% 0%,92% 23%,92% 73%,50% 100%,8% 73%,8% 23%);background:linear-gradient(145deg,rgba(247,255,251,.95),rgba(218,247,234,.72));box-shadow:inset 0 1px 0 rgba(255,255,255,.9);transform:translateZ(12px) rotateY(8deg);}
    .hex-face svg{width:48px;height:48px;filter:drop-shadow(0 8px 7px rgba(20,100,71,.18));animation:leafPulse 3s ease-in-out infinite;}
    html[data-theme="dark"] .hex-face{background:linear-gradient(145deg,rgba(37,76,65,.98),rgba(23,57,54,.92))}
    .wordmark{font-family:'Manrope',sans-serif;font-weight:800;font-size:clamp(29px,6vw,38px);letter-spacing:-.055em;line-height:1.1;margin:2px 0 7px}
    .wordmark span{color:var(--green)}
    .tagline{margin:0;color:var(--muted);font-size:10px;line-height:1.6;font-weight:800;letter-spacing:.2em;text-transform:uppercase}
    .headline{margin:25px 0 7px;font-family:'Manrope',sans-serif;font-size:clamp(18px,4vw,22px);letter-spacing:-.035em;font-weight:800}
    .subline{margin:0;color:var(--muted);font-size:13px;line-height:1.7}
    .progress-wrap{margin:26px auto 0;max-width:330px}
    .progress-meta{display:flex;justify-content:space-between;gap:12px;font-size:10px;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:10px}
    .progress-track{height:6px;overflow:hidden;background:color-mix(in srgb,var(--green) 11%,transparent);border:1px solid color-mix(in srgb,var(--green) 10%,transparent);border-radius:20px;position:relative}
    .progress-fill{height:100%;width:6%;border-radius:inherit;background:linear-gradient(90deg,var(--green),var(--sky),var(--pink),var(--green2));background-size:220% 100%;box-shadow:0 0 14px color-mix(in srgb,var(--green2) 30%,transparent);animation:progressLoad 2.4s cubic-bezier(.25,.65,.25,1) forwards,progressSheen 2s linear infinite}
    .foot{margin:23px 0 0;color:var(--muted);font-size:11px;display:flex;justify-content:center;align-items:center;gap:8px}
    .foot svg{width:15px;height:15px;color:var(--green)}
    .dots{display:inline-flex;gap:4px;margin-left:2px}
    .dots i{width:4px;height:4px;border-radius:50%;background:var(--green);animation:dotBeat 1.1s ease-in-out infinite}
    .dots i:nth-child(2){animation-delay:.16s}.dots i:nth-child(3){animation-delay:.32s}
    @keyframes cardRise{from{opacity:0;transform:translateY(20px) scale(.975)}to{opacity:1;transform:translateY(0) scale(1)}}
    @keyframes coreFloat{0%,100%{transform:translateY(0) rotateX(-4deg) rotateY(-7deg)}50%{transform:translateY(-8px) rotateX(4deg) rotateY(8deg)}}
    @keyframes shadowPulse{0%,100%{transform:rotateX(72deg) scale(1);opacity:.58}50%{transform:rotateX(72deg) scale(.78);opacity:.28}}
    @keyframes haloSpin{from{transform:rotateX(65deg) rotateZ(0)}to{transform:rotateX(65deg) rotateZ(360deg)}}
    @keyframes nodeFloat{0%,100%{translate:0 0;scale:1}50%{translate:0 -7px;scale:1.12}}
    @keyframes leafPulse{0%,100%{transform:translateZ(0) scale(1)}50%{transform:translateZ(7px) scale(1.06)}}
    @keyframes progressLoad{0%{width:5%}35%{width:42%}70%{width:76%}100%{width:96%}}
    @keyframes progressSheen{to{background-position:220% 0}}
    @keyframes dotBeat{0%,80%,100%{transform:translateY(0);opacity:.4}40%{transform:translateY(-4px);opacity:1}}
    @keyframes ambientDrift{to{transform:translate3d(16px,-12px,0) scale(1.1)}}
    @media(max-width:480px){.shell{border-radius:25px;padding:25px 21px 27px}.visual{height:205px}.halo.h2{width:192px;height:192px}.node.n2{right:42px}.node.n3{left:41px}.headline{margin-top:19px}.progress-wrap{margin-top:22px}}
    @media(max-height:700px){.shell{padding:20px 24px;border-radius:25px}.visual{height:164px;margin-bottom:0}.halo{width:142px;height:142px}.halo.h2{width:170px;height:170px}.halo.h3{width:124px;height:124px}.core-float{transform:scale(.82);animation:coreFloatCompact 4.4s ease-in-out infinite}.node{top:8px}.node.n3{top:50px;left:calc(50% - 78px)}.node.n2{bottom:25px;right:calc(50% - 82px)}.headline{margin-top:17px}.progress-wrap{margin-top:18px}.foot{margin-top:15px}}
    @keyframes coreFloatCompact{0%,100%{transform:scale(.82) translateY(0) rotateX(-4deg) rotateY(-7deg)}50%{transform:scale(.82) translateY(-6px) rotateX(4deg) rotateY(8deg)}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important}.progress-fill{width:96%}}
  </style>
</head>
<body>
  <svg class="eco-grid" aria-hidden="true" viewBox="0 0 1200 900" preserveAspectRatio="xMidYMid slice">
    <defs><pattern id="honeycomb" width="72" height="62" patternUnits="userSpaceOnUse"><path d="M18 1 L36 11.5 L36 32.5 L18 43 L0 32.5 L0 11.5 Z M54 32 L72 42.5 L72 63.5 L54 74 L36 63.5 L36 42.5 Z" fill="none" stroke="currentColor" stroke-width="1.05"/></pattern></defs>
    <rect width="1200" height="900" fill="url(#honeycomb)"/>
  </svg>
  <div class="ambient a" aria-hidden="true"></div><div class="ambient b" aria-hidden="true"></div>
  <main class="shell" aria-labelledby="loader-title">
    <div class="micro-label">A little more sustainable</div>
    <div class="visual" aria-hidden="true">
      <div class="halo"></div><div class="halo h2"></div><div class="halo h3"></div>
      <span class="node"></span><span class="node n2"></span><span class="node n3"></span>
      <div class="core-float">
        <div class="core-shadow"></div><div class="hex-stack back"></div><div class="hex-stack"></div>
        <div class="hex-face"><svg viewBox="0 0 64 64" fill="none"><path d="M49 12C29 11 15 21 15 37c0 8 6 14 14 14 16 0 24-15 20-39Z" fill="#36AD80"/><path d="M12 51c8-14 18-23 31-31" stroke="#176F57" stroke-width="3.5" stroke-linecap="round"/><path d="M18 40c6-1 11 0 15 4M28 28c5 0 9 2 12 5" stroke="#E9FFF4" stroke-width="2.5" stroke-linecap="round"/></svg></div>
      </div>
    </div>
    <div class="wordmark">Eco <span>Points</span></div>
    <p class="tagline">Small actions. Shared impact.</p>
    <h1 class="headline" id="loader-title">Your next good action starts here.</h1>
    <p class="subline">Preparing your environmental impact space.</p>
    <div class="progress-wrap" aria-label="Loading Eco Points">
      <div class="progress-meta"><span>Connecting to Eco Points</span><span id="progress-status">Preparing</span></div>
      <div class="progress-track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="5" aria-label="Loading Eco Points"><div class="progress-fill" id="progress-fill"></div></div>
    </div>
    <div class="foot"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s8-4 8-11V5l-8-3-8 3v6c0 7 8 11 8 11Z"/><path d="m9 12 2 2 4-4"/></svg><span>Thoughtful actions, verified with care</span><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span></div>
  </main>
  <script>
    (function(){
      try { var t=localStorage.getItem('hive_theme'); if(t==='dark') document.documentElement.setAttribute('data-theme','dark'); var tm=document.querySelector('meta[name="theme-color"]'); if(tm) tm.content=t==='dark'?'#10231f':'#EAF8F1'; } catch(e) {}
      var start=Date.now(), duration=2500, status=document.getElementById('progress-status'), bar=document.querySelector('.progress-track'), redirectStarted=false;
      function finish(){ if(redirectStarted)return; redirectStarted=true; if(status)status.textContent='Ready'; if(bar)bar.setAttribute('aria-valuenow','100'); var f=document.getElementById('progress-fill'); if(f)f.style.width='100%'; setTimeout(function(){window.location.replace('ecopoints.html');},180); }
      function tick(){var p=Math.min(0.96,(Date.now()-start)/duration); if(bar)bar.setAttribute('aria-valuenow',String(Math.round(p*100))); if(status)status.textContent=p<.34?'Preparing':p<.68?'Connecting':'Almost there'; if(p>=.96){finish();return;} requestAnimationFrame(tick);}
      requestAnimationFrame(tick);
      setTimeout(finish,3200);
    })();
  </script>
  <noscript><meta http-equiv="refresh" content="1;url=ecopoints.html"></noscript>
</body>
</html>
