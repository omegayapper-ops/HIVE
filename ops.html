<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>HIVE Ops — Admin operating panel</title><meta name="robots" content="noindex"><meta name="theme-color" content="#DDEEFF"><link rel="icon" href="hive_mark.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Poppins:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1220;--card:#131d33;--line:#22304f;--text:#f8fafc;--muted:#94a3b8;--teal:#2dd4bf;--gold:#fbbf24;--red:#f87171;--green:#4ade80}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Inter,system-ui,sans-serif}
h1,h2,h3{font-family:Poppins,Inter,sans-serif;margin:0}.wrap{max-width:1100px;margin:0 auto;padding:0 16px 40px}
/* brand */
.wm{font-family:Poppins,Inter,sans-serif;font-weight:700;color:#f8fafc}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:radial-gradient(ellipse 70% 50% at 50% 0%,rgba(45,212,191,.13),transparent 70%),radial-gradient(ellipse 60% 40% at 50% 100%,rgba(251,191,36,.08),transparent 70%),var(--bg)}
.login .box{width:min(400px,100%);animation:rise .5s ease both}@keyframes rise{from{opacity:0;transform:translateY(10px)}}
.brand-big{text-align:center;margin-bottom:22px}
.brand-big .mk{display:block;width:min(180px,50vw);height:auto;margin:0 auto 4px;filter:drop-shadow(0 10px 30px rgba(251,191,36,.2))}
.brand-big .wm{font-size:40px;line-height:1.1;letter-spacing:.3em;margin-left:.3em}
.brand-big .bar{width:92px;height:4px;border-radius:4px;margin:12px auto 10px;background:linear-gradient(90deg,#fbbf24,#f97316)}
.brand-big .tg{font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:center;box-shadow:0 20px 50px rgba(0,0,0,.35)}
.top{position:sticky;top:0;z-index:6;background:rgba(11,18,32,.9);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}
.top .in{max-width:1100px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px}
.brand-sm{display:flex;align-items:center;gap:10px}.brand-sm img{width:32px;height:35px;display:block}.brand-sm .wm{font-size:20px;letter-spacing:.18em}
.chip{font:700 10px Inter;letter-spacing:.12em;text-transform:uppercase;color:#0b1220;background:var(--gold);border-radius:99px;padding:3px 8px}
/* ui */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;animation:pop .3s cubic-bezier(.2,1.3,.4,1) both}@keyframes pop{from{transform:scale(.97);opacity:0}}
.card.blk{border-left:3px solid var(--red)}.card.pen{border-left:3px solid var(--gold)}
input,select,textarea{width:100%;background:#0b1220;border:1px solid var(--line);color:var(--text);border-radius:10px;padding:10px;font:inherit;margin:4px 0}
input:focus,select:focus,textarea:focus{outline:2px solid var(--teal);outline-offset:1px}
button{font:inherit;font-weight:700;border:0;border-radius:10px;padding:9px 14px;cursor:pointer;background:var(--teal);color:#0b1220;transition:transform .12s,opacity .2s}button:active{transform:scale(.95)}button:disabled{opacity:.5;cursor:wait}
button.g{background:transparent;border:1px solid var(--line);color:var(--text)}button.r{background:var(--red)}button.y{background:var(--gold)}button.ok{background:var(--green)}button.sm{padding:6px 11px;font-size:12px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:12px 0;padding-bottom:4px;-webkit-overflow-scrolling:touch}.tabs button{background:var(--card);color:var(--text);border:1px solid var(--line);white-space:nowrap}.tabs button.on{background:var(--teal);color:#0b1220;border-color:var(--teal)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row>*{flex:1;min-width:110px}.row>button{flex:0 0 auto}
.m{color:var(--muted);font-size:12px}.tag{padding:2px 9px;border-radius:99px;font-size:11px;font-weight:700;background:#22304f;white-space:nowrap}
.approved,.verified,.active,.found{color:var(--green)}.denied,.rejected,.blocked,.lost{color:var(--red)}.questioned,.submitted,.pending{color:var(--gold)}.noaccess,.returned{color:#cbd5e1}
details{border-top:1px solid var(--line);padding:8px 0}summary{cursor:pointer;font-weight:600}.tmp{background:#0f2a2a;border:1px dashed var(--teal);border-radius:10px;padding:10px;margin:8px 0;font-family:monospace}
#t{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#fff;color:#0b1220;padding:10px 18px;border-radius:99px;font-weight:700;display:none;z-index:9;max-width:92vw;text-align:center}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:10px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px}.stat b{display:block;font:700 24px Poppins,Inter}.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:700}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.pills button{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px 12px;border-radius:99px;font-size:12px}.pills button.on{background:var(--teal);border-color:var(--teal);color:#0b1220}
.sw{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--line)}.sw:last-of-type{border:0}.sw>div{flex:1}
.tg2{position:relative;flex:0 0 52px!important;width:52px;height:28px;border-radius:14px;padding:0;background:#475569}.tg2:after{content:'';position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .2s}.tg2.on{background:var(--green)}.tg2.on:after{transform:translateX(24px)}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:640px}th{text-align:left;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.04em;padding:8px;border-bottom:1px solid var(--line)}td{padding:10px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.th{width:42px;height:42px;border-radius:8px;object-fit:cover;border:1px solid var(--line);background:#0b1220;display:grid;place-items:center;flex:0 0 42px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.cats>div{background:#0b1220;border:1px solid var(--line);border-radius:10px;padding:8px}.cats b{font-size:18px}
.warn{border-color:var(--gold)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head><body>
<div id="app"></div><div id="t" role="status" aria-live="polite"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
var ERR='',LFERR='',LFMISS=false,CM={posts:[],episodes:[],clubs:[]},CMMISS=false,CMERR='';var C=supabase.createClient('https://uhesiuyjbiwpwlulmaqw.supabase.co','sb_publishable_T7oa-3syn79PiHlf63EKVg_KhNz5lMg'),PW='',
D={students:[],attendance:[],subjects:[],leaves:[],meals:[],payments:[],announcements:[],events:[],config:{}},LF={users:[],items:[],settings:{}},U={},
tab='students',tmp='',sf='all',sq='',iflt='all',iq='',OPEN={};
function X(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function $(i){return document.getElementById(i);}function V(i){return ($(i)||{}).value||'';}
function toast(m){var t=$('t');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none';},3800);}
function gen(){var a=new Uint32Array(10),c='abcdefghjkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';crypto.getRandomValues(a);var s='';for(var i=0;i<10;i++)s+=c[a[i]%c.length];return s+'7a';}
function fd(v){try{return new Date(v).toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});}catch(e){return '';}}
function isMissing(e){return !!e&&(e.code==='PGRST202'||/could not find the function|schema cache/i.test(e.message||''));}
function nice(e){var m=(e&&e.message)||String(e);return m.replace('INVALID_ADMIN_PASSWORD','Admin password rejected — press Lock and unlock again');}
async function get(w){var r=await C.rpc('ops_get',{p_password:PW,p_what:w});if(r.error)throw r.error;return r.data;}
async function cget(w){var r=await C.rpc('ops_cm_get',{p_password:PW,p_what:w});if(r.error)throw r.error;return r.data;}
async function cdo(op,p,msg){var r=await C.rpc('ops_cm_do',{p_password:PW,p_op:op,p:p});if(r.error){toast(isMissing(r.error)?'Run hive3.sql in Supabase first':nice(r.error));return false;}toast(msg||'Saved');await load();return true;}
/* EcoPoints admin (eco.sql) */
var ECO=[],ECOMISS=false,ECOERR='',ef='all';
async function eget(w){var r=await C.rpc('ops_eco_get',{p_password:PW,p_what:w});if(r.error)throw r.error;return r.data;}
async function edo(op,p,msg,btn){if(btn)btn.disabled=true;var r=await C.rpc('ops_eco_do',{p_password:PW,p_op:op,p:p});if(r.error){toast(isMissing(r.error)?'Run eco.sql in Supabase first':nice(r.error));if(btn)btn.disabled=false;return false;}toast(msg||'Saved');await load();return true;}
async function lget(w){var r=await C.rpc('ops_lf_get',{p_password:PW,p_what:w});if(r.error)throw r.error;return r.data;}
async function act(op,p,msg){var r=await C.rpc('ops_do',{p_password:PW,p_op:op,p:p});if(r.error){toast(nice(r.error));return false;}toast(msg||'Saved');await load();return true;}
/* Lost & Found / access actions. btn (optional) is disabled while the request runs. */
async function lf(op,p,msg,btn,fallback){
  if(btn)btn.disabled=true;
  var r=await C.rpc('ops_lf_do',{p_password:PW,p_op:op,p:p});
  if(r.error&&isMissing(r.error)){
    if(fallback){r=await fallback();}
    else{toast('Run ops_integration.sql in Supabase first (see README_HIVE.md)');if(btn)btn.disabled=false;return false;}
  }
  if(r.error){toast(nice(r.error));if(btn)btn.disabled=false;return false;}
  toast(msg);await load();return true;}
/* ---------- brand ---------- */
function brandBig(){return '<div class="brand-big"><img class="mk" src="hive_mark.svg" width="336" height="368" alt=""><div class="wm">HIVE</div><div class="bar"></div><div class="tg">Your community, truly intelligent</div></div>';}
function loginView(m){PW='';$('app').innerHTML='<div class="login"><div class="box">'+brandBig()+'<div class="panel"><h2 style="font-size:17px;margin-bottom:2px">Operating panel</h2><div class="m">Admin access only</div><input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" onkeydown="if(event.key===\'Enter\')signin()"><button style="width:100%;margin-top:8px" id="sb" onclick="signin()">Unlock</button><div class="m" style="margin-top:10px;color:var(--red);min-height:16px" role="alert">'+X(m||'')+'</div></div><div class="m" style="text-align:center;margin-top:14px"><a href="index.html" style="color:var(--gold);text-decoration:none">← Back to the HIVE app</a><div class="admin-launchlinks"><a href="admin.html">Admin hub</a><a href="admin-education.html">Education</a><a href="admin-medical.html">Medical</a><a href="admin_legacy.html">Legacy Lost &amp; Found</a></div></div></div></div>';var p=$('pw');if(p)p.focus();}
async function signin(){var p=V('pw');if(!p)return;$('sb').disabled=true;$('sb').textContent='Checking…';
  var r=await C.rpc('admin_check',{p_password:p});
  if(r.error){loginView('Server problem: '+r.error.message+' (has the SQL been run?)');return;}
  if(r.data!==true){loginView('Incorrect password. (If hive2.sql has not been run in Supabase yet, the old admin password is still active.)');return;}
  PW=p;await load();}
async function load(){
  try{var k=['students','attendance','subjects','leaves','meals','payments','announcements','events','config'];var v=await Promise.all(k.map(get));k.forEach(function(x,i){D[x]=v[i];});ERR='';}catch(e){ERR=nice(e);}
  try{var l=await Promise.all(['users','items','settings'].map(lget));LF.users=l[0]||[];LF.items=l[1]||[];LF.settings=l[2]||{};LFERR='';LFMISS=false;}
  catch(e){LFMISS=isMissing(e);LFERR=LFMISS?'':nice(e);LF={users:[],items:[],settings:{}};}
  try{var c=await Promise.all(['posts','episodes','clubs'].map(cget));CM={posts:c[0]||[],episodes:c[1]||[],clubs:c[2]||[]};CMMISS=false;CMERR='';}catch(e){CMMISS=isMissing(e);CMERR=CMMISS?'':nice(e);CM={posts:[],episodes:[],clubs:[]};}
  try{ECO=(await eget('activities'))||[];ECOMISS=false;ECOERR='';}catch(e){ECOMISS=isMissing(e);ECOERR=ECOMISS?'':nice(e);ECO=[];}
  U={};LF.users.forEach(function(u){U[u.id]=u;});draw();}
/* ---------- helpers ---------- */
function st(u){if(u.is_blocked)return 'blocked';if(u.is_approved===false)return 'pending';if(u.access_granted===false)return 'noaccess';return 'active';}
var SL={active:'✅ Active',blocked:'🚫 Blocked',pending:'⏳ Pending approval',noaccess:'🔒 No access'};
function badge(s){return '<span class="tag '+s+'">'+SL[s]+'</span>';}
function det(k,sum,body){return '<details data-k="'+k+'"'+(OPEN[k]?' open':'')+' ontoggle="OPEN[this.dataset.k]=this.open"><summary>'+sum+'</summary>'+body+'</details>';}
function tag(s){return '<span class="tag '+X(s)+'">'+X(s)+'</span>';}
function notice(){return LFMISS?'<div class="card warn"><b>One more setup step</b><div class="m">Open Supabase → SQL Editor, paste the whole of <b>ops_integration.sql</b> and press Run. Then reload this page. Until then Block / Unblock still works, but approvals, access, settings and Lost &amp; Found items need that file.</div></div>':(LFERR?'<div class="card" style="border-color:var(--red)"><b>Could not load Lost &amp; Found data:</b> '+X(LFERR)+'</div>':'');}
/* user action buttons (shared by Students and Access tabs) */
function uActs(u){var s=st(u),b=[],has=!!U[u.id];
  b.push(u.is_blocked?'<button class="ok sm" data-id="'+X(u.id)+'" onclick="uAct(\'unblock\',this)">🔓 Unblock</button>':'<button class="r sm" data-id="'+X(u.id)+'" onclick="uAct(\'block\',this)">🚫 Block</button>');
  if(has){
    if(u.is_approved===false)b.push('<button class="ok sm" data-id="'+X(u.id)+'" onclick="uAct(\'approve\',this)">✅ Approve</button>');
    else if(LF.settings.require_approval&&!u.is_blocked)b.push('<button class="g sm" data-id="'+X(u.id)+'" onclick="uAct(\'revoke\',this)">↩ Revoke approval</button>');
    b.push(u.access_granted===false?'<button class="ok sm" data-id="'+X(u.id)+'" onclick="uAct(\'grant\',this)">🔓 Grant access</button>':'<button class="g sm" data-id="'+X(u.id)+'" onclick="uAct(\'deny\',this)">🔒 Deny access</button>');}
  return '<div class="row" style="margin-top:8px">'+b.join('')+'</div>';}
async function uAct(kind,btn){var id=btn.dataset.id,u=U[id]||D.students.filter(function(x){return x.id===id;})[0];if(!u)return;var who=u.name||u.email||'this user';
  var c={block:['Block "'+who+'"?\n\nThey are signed out straight away and cannot sign in to HIVE or Lost & Found until you unblock them.','set_blocked',{user_id:id,blocked:true},'🚫 '+who+' blocked'],
   unblock:['Unblock "'+who+'"?\n\nThey will be able to sign in again.','set_blocked',{user_id:id,blocked:false},'🔓 '+who+' unblocked'],
   approve:['Approve "'+who+'"?','set_approved',{user_id:id,approved:true},'✅ Approved'],
   revoke:['Move "'+who+'" back to pending approval?','set_approved',{user_id:id,approved:false},'↩ Approval revoked'],
   grant:['Give "'+who+'" access to the apps?','set_access',{user_id:id,granted:true},'🔓 Access granted'],
   deny:['Revoke app access for "'+who+'"?\n\nThey will be signed out and see a "No access" message.','set_access',{user_id:id,granted:false},'🔒 Access denied']}[kind];
  if(!c||!confirm(c[0]))return;
  var fb=c[1]==='set_blocked'?function(){return C.rpc('admin_set_blocked',{p_password:PW,p_user:id,p_blocked:c[2].blocked});}:null;
  await lf(c[1],c[2],c[3],btn,fb);}
function counts(){var n={all:D.students.length,active:0,pending:0,blocked:0,noaccess:0};D.students.forEach(function(s){n[st(U[s.id]||s)]++;});return n;}
function sList(){var n=counts(),P=[['all','All'],['active','Active'],['blocked','Blocked'],['pending','Pending'],['noaccess','No access']];
  var q=sq.toLowerCase().trim(),L=D.students.filter(function(s){var u=U[s.id]||s;if(sf!=='all'&&st(u)!==sf)return false;return !q||((s.name||'')+' '+(s.email||'')+' '+(s.roll_no||'')).toLowerCase().indexOf(q)>=0;});
  return '<div class="pills">'+P.map(function(p){return '<button class="'+(sf===p[0]?'on':'')+'" onclick="sf=\''+p[0]+'\';$(\'slist\').innerHTML=sList()">'+p[1]+' ('+n[p[0]]+')</button>';}).join('')+'</div>'+
  (L.map(function(s){var u=Object.assign({},s,U[s.id]||{}),S=st(u);
    var rows=D.subjects.map(function(b){var a=D.attendance.filter(function(x){return x.user_id===s.id&&x.subject_code===b.code;})[0]||{attended:0,total:0};
      return '<div class="row"><b style="flex:0 0 60px">'+X(b.code)+'</b><input type="number" min="0" id="a'+s.id+b.code+'" value="'+a.attended+'" aria-label="Attended"><input type="number" min="0" id="t'+s.id+b.code+'" value="'+a.total+'" aria-label="Total classes"><span class="m" style="flex:0 0 52px">'+(a.total?(a.attended/a.total*100).toFixed(1)+'%':'—')+'</span></div>';}).join('');
    return '<div class="card'+(S==='blocked'?' blk':S==='pending'?' pen':'')+'"><div class="row" style="justify-content:space-between"><div style="flex:1"><b>'+X(s.name)+'</b> '+badge(S)+(s.must_change_password?' <span class="tag pending">temp password</span>':'')+'<div class="m">Username: <b>'+X((s.email||'').replace('@hive.local',''))+'</b>'+(s.roll_no?' · '+X(s.roll_no):'')+(u.created_at?' · joined '+fd(u.created_at):'')+'</div></div></div>'+uActs(u)+
    det('att'+s.id,'Attendance (attended / total classes)',rows+'<button style="margin-top:8px" onclick="saveAtt(\''+s.id+'\')">Save attendance</button>')+
    det('rp'+s.id,'Reset password','<div class="m">Sets a new temporary password; the student must change it on next sign-in.</div><div class="row"><input id="p'+s.id+'" value="'+gen()+'"><button class="y" onclick="resetP(\''+s.id+'\')">Reset</button></div>')+'</div>';}).join('')||'<div class="m" style="padding:10px 0">'+(D.students.length?'No students match.':'No students yet.')+'</div>');}
function iList(){var I=LF.items,n={all:I.length,lost:0,found:0,open:0,returned:0};I.forEach(function(i){if(i.type==='lost')n.lost++;if(i.type==='found')n.found++;if(i.status==='returned')n.returned++;else n.open++;});
  var P=[['all','All'],['lost','Lost'],['found','Found'],['open','Open'],['returned','Returned']],q=iq.toLowerCase().trim();
  var L=I.filter(function(i){if(iflt==='lost'&&i.type!=='lost')return false;if(iflt==='found'&&i.type!=='found')return false;if(iflt==='open'&&i.status==='returned')return false;if(iflt==='returned'&&i.status!=='returned')return false;return !q||((i.name||'')+' '+(i.category||'')+' '+(i.location||'')+' '+(i.owner_name||'')).toLowerCase().indexOf(q)>=0;});
  return '<div class="pills">'+P.map(function(p){return '<button class="'+(iflt===p[0]?'on':'')+'" onclick="iflt=\''+p[0]+'\';$(\'ilist\').innerHTML=iList()">'+p[1]+' ('+n[p[0]]+')</button>';}).join('')+'</div>'+
  (L.length?'<div class="tw"><table><thead><tr><th>Item</th><th>Type</th><th>Category</th><th>Location</th><th>Posted by</th><th>Status</th><th></th></tr></thead><tbody>'+L.map(function(i){
    var ph=(i.photo_url&&/^https:\/\//i.test(i.photo_url))?'<a href="'+X(i.photo_url)+'" target="_blank" rel="noopener"><img class="th" src="'+X(i.photo_url)+'" alt="" loading="lazy"></a>':'<span class="th">📦</span>';
    return '<tr><td><div class="row" style="flex-wrap:nowrap;gap:10px">'+ph+'<div style="min-width:0"><b>'+X(i.name)+'</b><div class="m">'+fd(i.created_at)+'</div></div></div></td><td>'+tag(i.type==='lost'?'lost':'found')+'</td><td>'+X(i.category)+'</td><td>'+X(i.location)+'</td><td>'+X(i.owner_name||'—')+'</td><td>'+(i.status==='returned'?tag('returned'):'<span class="m">Open</span>')+'</td><td><button class="r sm" data-id="'+X(i.id)+'" data-name="'+X(i.name)+'" onclick="delItem(this)">🗑 Delete</button></td></tr>';}).join('')+'</tbody></table></div>':'<div class="m" style="padding:10px 0">'+(I.length?'No items match.':'No items yet.')+'</div>');}
function sw(id,on,t,d,w){return '<div class="sw"><div><b>'+t+'</b><div class="m">'+d+'</div></div><button id="'+id+'" class="tg2'+(on?' on':'')+'" role="switch" aria-checked="'+on+'" aria-label="'+t+'" onclick="toggleSet(\''+w+'\',this)"></button></div>';}
/* ---------- EcoPoints admin ---------- */
var ECAT={plastic:'Plastic reduction',recycle:'Recycling',tree:'Tree plantation',clean:'Cleanliness',water:'Water conservation',other:'Awareness & other'},EDIF=['Easy','Medium','Hard'],
EEMO=['🌱','🌳','♻️','💧','🧹','🧤','👜','🚲','📢','🍃','💡','🥤','📚','🌍'],
EIDEAS=[['💡','Switch Off Unused Lights','Turn off lights and fans in empty rooms and show how.','other',10,'Easy'],['🥤','Carry a Reusable Bottle','Use a refillable bottle for a whole week instead of plastic ones.','plastic',15,'Easy'],['♻️','Start a Compost Pit','Turn canteen or garden waste into compost.','recycle',40,'Hard'],['💧','Rainwater Harvesting','Set up or maintain a rainwater collection point.','water',45,'Hard'],['📚','Donate Books & Clothes','Give reusable books or clothes to someone who needs them.','recycle',20,'Easy'],['🌍','Eco Pledge Drive','Collect eco pledges from classmates and share the photos.','other',30,'Medium']];
function eOpt(a,s){return a.map(function(x){return '<option value="'+X(x)+'"'+(x===s?' selected':'')+'>'+X(x)+'</option>';}).join('');}
function eCatOpt(s){return Object.keys(ECAT).map(function(k){return '<option value="'+k+'"'+(k===s?' selected':'')+'>'+X(ECAT[k])+'</option>';}).join('');}
function eForm(pre,a){a=a||{};
  return '<div class="row"><input id="'+pre+'em" maxlength="8" placeholder="Emoji" value="'+X(a.emoji||'🌿')+'" style="max-width:90px;flex:0 0 90px" aria-label="Emoji"><input id="'+pre+'ti" maxlength="80" placeholder="Activity name (e.g. Switch Off Unused Lights)" value="'+X(a.title||'')+'" aria-label="Activity name"></div>'+
  '<div class="row"><select id="'+pre+'ca" aria-label="Category">'+eCatOpt(a.cat||'other')+'</select><input id="'+pre+'pt" type="number" min="1" max="1000" step="1" placeholder="Points (1-1000)" value="'+X(a.points||'')+'" aria-label="Points"><select id="'+pre+'df" aria-label="Difficulty">'+eOpt(EDIF,a.difficulty||'Easy')+'</select></div>'+
  '<textarea id="'+pre+'de" rows="2" maxlength="200" placeholder="Short description students will see">'+X(a.description||'')+'</textarea>'+
  '<input id="'+pre+'im" placeholder="Photo link, https://... (optional)" value="'+X(a.image||'')+'" autocapitalize="off" aria-label="Photo link">';}
function eVal(pre){return {emoji:V(pre+'em').trim(),title:V(pre+'ti').trim(),cat:V(pre+'ca'),points:Math.round(+V(pre+'pt')),difficulty:V(pre+'df'),description:V(pre+'de').trim(),image:V(pre+'im').trim()};}
function eCheck(p){if(p.title.length<3)return 'Add an activity name (3+ characters)';if(!(p.points>=1&&p.points<=1000))return 'Points must be a whole number from 1 to 1000';if(p.image&&!/^https:\/\/\S+$/i.test(p.image))return 'The photo link must start with https://';return '';}
function eIdea(i){var a=EIDEAS[i];if(!a)return;$('nem').value=a[0];$('nti').value=a[1];$('nde').value=a[2];$('nca').value=a[3];$('npt').value=a[4];$('ndf').value=a[5];$('nim').value='';$('nti').focus();}
async function eAdd(btn){var p=eVal('n'),m=eCheck(p);if(m){toast(m);return;}await edo('add_activity',p,'✅ "'+p.title+'" added — students can pick it now',btn);}
async function eSave(btn){var id=+btn.dataset.id,p=eVal('e'+id),m=eCheck(p);if(m){toast(m);return;}p.id=id;await edo('update_activity',p,'Activity saved',btn);}
async function eTog(btn){var on=btn.dataset.on==='1';await edo('set_active',{id:+btn.dataset.id,active:on},on?'👁 Activity is live again':'Activity hidden from students',btn);}
async function eMov(btn){await edo('move_activity',{id:+btn.dataset.id,dir:btn.dataset.dir},'Order updated',btn);}
async function eDel(btn){if(!confirm('Delete "'+btn.dataset.name+'"?\n\nIt disappears from EcoPoints for good. Proofs students already submitted keep their points.\n\nTip: Hide is reversible — Delete is not.'))return;await edo('delete_activity',{id:+btn.dataset.id},'🗑 Activity deleted',btn);}
function eList(){var n={all:ECO.length,live:0,hidden:0};ECO.forEach(function(a){if(a.active)n.live++;else n.hidden++;});
  var P=[['all','All'],['live','Live'],['hidden','Hidden']],L=ECO.filter(function(a){return ef==='all'||(ef==='live'?a.active:!a.active);});
  return '<div class="pills">'+P.map(function(q){return '<button class="'+(ef===q[0]?'on':'')+'" onclick="ef=\''+q[0]+'\';$(\'elist\').innerHTML=eList()">'+q[1]+' ('+n[q[0]]+')</button>';}).join('')+'</div>'+
  (L.map(function(a){var i=ECO.indexOf(a),id=X(a.id),im=/^https:\/\//i.test(a.image||'')?'<img class="th" style="min-width:0" src="'+X(a.image)+'" alt="" loading="lazy" referrerpolicy="no-referrer">':'<span class="th" style="min-width:0">'+X(a.emoji)+'</span>';
    return '<div class="card'+(a.active?'':' pen')+'"><div class="row" style="flex-wrap:nowrap;align-items:flex-start;gap:10px">'+im+'<div style="flex:1;min-width:0"><b>'+X(a.emoji)+' '+X(a.title)+'</b><div style="margin:4px 0"><span class="tag active">+'+X(a.points)+' pts</span> <span class="tag pending">'+X(a.difficulty)+'</span> <span class="tag">'+X(ECAT[a.cat]||a.cat)+'</span> '+(a.active?'<span class="tag approved">Live</span>':'<span class="tag blocked">Hidden</span>')+'</div><div class="m">'+X(a.description||'No description')+'</div></div></div>'+
    '<div class="row" style="margin-top:8px">'+(ef==='all'?'<button class="g sm" data-id="'+id+'" data-dir="up" style="min-width:0" onclick="eMov(this)" aria-label="Move up"'+(i===0?' disabled':'')+'>▲</button><button class="g sm" data-id="'+id+'" data-dir="down" style="min-width:0" onclick="eMov(this)" aria-label="Move down"'+(i===ECO.length-1?' disabled':'')+'>▼</button>':'')+
    (a.active?'<button class="g sm" data-id="'+id+'" data-on="0" onclick="eTog(this)">Hide</button>':'<button class="ok sm" data-id="'+id+'" data-on="1" onclick="eTog(this)">Show</button>')+'<button class="r sm" data-id="'+id+'" data-name="'+X(a.title)+'" onclick="eDel(this)">Delete</button></div>'+
    det('eco'+a.id,'Edit activity',eForm('e'+a.id,a)+'<button style="margin-top:8px" data-id="'+id+'" onclick="eSave(this)">Save changes</button>')+'</div>';}).join('')||'<div class="m" style="padding:10px 0">'+(ECO.length?'Nothing here.':'No activities yet.')+'</div>');}

  (n.pending?'<button class="y" style="margin-top:6px" onclick="approveAll(this)">Approve all '+n.pending+' pending</button>':'')+'</div>'+
  '<div class="card"><h3 style="margin-bottom:4px">Needs attention</h3>'+(att.length?att.map(function(u){return '<div style="border-top:1px solid var(--line);padding:10px 0"><b>'+X(u.name||u.email)+'</b> '+badge(st(u))+'<div class="m">'+X((u.email||'').replace('@hive.local',''))+'</div>'+uActs(u)+'</div>';}).join(''):'<div class="m">Nobody is blocked, pending or without access. 🎉</div>')+'</div>';},
lf:function(){var I=LF.items,o=I.filter(function(i){return i.status!=='returned';}).length,by={};I.forEach(function(i){var c=i.category||'Others';by[c]=(by[c]||0)+1;});var ks=Object.keys(by).sort(function(a,b){return by[b]-by[a];});

  return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+X(l.name)+' · '+({apply:'Leave',permission:'Permission',inform:'Inform'}[l.kind])+'</b>'+tag(l.status)+'</div><div class="m">'+X(l.from_date)+(l.to_date!==l.from_date?' → '+X(l.to_date):'')+' · filed '+X(l.created_at.slice(0,10))+'</div><div>'+X(l.reason)+'</div>'+(l.proof?'<div class="m">Proof: '+X(l.proof)+'</div>':'')+(l.student_reply?'<div class="m">Student reply: '+X(l.student_reply)+'</div>':'')+(l.admin_note?'<div class="m">Your note: '+X(l.admin_note)+'</div>':'')+

payments:function(){var c=D.config||{};return '<div class="card"><h3>UPI receiving account</h3><div class="m">Students pay to this UPI ID; you verify the UTR. Gateway secrets or bank passwords must never be stored here — keep them in Supabase Edge Function secrets when real billing is switched on.</div><div class="row"><input id="up" placeholder="upi-id@bank" value="'+X(c.upi_id)+'"><input id="un" placeholder="Payee name" value="'+X(c.payee_name)+'"><button onclick="act(\'set_upi\',{upi_id:V(\'up\'),payee_name:V(\'un\')},\'UPI saved\')">Save</button></div></div>'+

  D.announcements.map(function(a){return '<div class="card"><div class="row" style="justify-content:space-between"><b>'+X(a.title)+'</b>'+tag(a.priority||'normal')+'</div><div class="m">'+X(a.created_at.slice(0,16).replace('T',' '))+' · '+X(a.category)+'</div><button class="r" style="margin-top:6px" onclick="if(confirm(\'Delete this announcement?\'))act(\'del_ann\',{id:'+a.id+'},\'Deleted\')">Delete</button></div>';}).join('');},
events:function(){return '<div class="card"><h3>Add calendar event</h3><div class="row"><input type="date" id="ed"><input id="et" placeholder="Title"><select id="ek"><option value="exam">Exam</option><option value="fee">Fee</option><option value="holiday">Holiday</option><option value="academic">Academic</option><option value="event">Event</option></select><button onclick="addE()">Add</button></div></div>'+
  D.events.map(function(e){return '<div class="card row" style="justify-content:space-between"><div style="flex:1"><b>'+X(e.title)+'</b><div class="m">'+X(e.event_date)+' · '+X(e.kind)+'</div></div><button class="r" onclick="act(\'del_event\',{id:'+e.id+'},\'Removed\')">Delete</button></div>';}).join('');},
subjects:function(){return D.subjects.map(function(s){return '<div class="card"><b>'+X(s.code)+' — '+X(s.name)+'</b><details><summary>Edit info</summary><textarea id="sd'+s.code+'" rows="4">'+X(s.description)+'</textarea><textarea id="ss'+s.code+'" rows="6" placeholder="One topic per line">'+X((s.syllabus||'').split('|').join('\n'))+'</textarea><input id="sf'+s.code+'" placeholder="Faculty" value="'+X(s.faculty)+'"><button onclick="saveS(\''+s.code+'\')">Save</button></details></div>';}).join('');}
};
function draw(){
  var T=[['students','Students'],['access','Access'],['lf','Lost & Found'],['leaves','Leave'],['meals','Mess'],['payments','Payments'],['news','News'],['community','Community'],['eco','EcoPoints'],['events','Calendar'],['subjects','Subjects']],
  pend=D.leaves.filter(function(l){return l.status==='pending';}).length,sub=D.payments.filter(function(p){return p.status==='submitted';}).length,ap=LF.users.filter(function(u){return st(u)==='pending';}).length;
  var cnt={leaves:pend,payments:sub,access:ap,community:CM.posts.filter(function(p){return p.kind==='problem'&&p.status==='open';}).length},sy=$('app').querySelector('.wrap')?window.scrollY:0;
  $('app').innerHTML='<div class="wrap"><div class="top"><div class="in"><div class="brand-sm"><img src="hive_mark.svg" width="32" height="35" alt=""><span class="wm">HIVE</span><span class="chip">Legacy Ops</span></div><div class="admin-nav"><a href="admin.html">Admin hub</a><a href="admin-education.html">Education</a><a href="admin-medical.html">Medical</a><a href="admin_legacy.html">Legacy L&amp;F</a><button class="g sm" onclick="loginView()">🔒 Lock</button></div></div></div><div class="tabs" role="tablist">'+T.map(function(t){return '<button role="tab" aria-selected="'+(tab===t[0])+'" class="'+(tab===t[0]?'on':'')+'" onclick="tab=\''+t[0]+'\';draw()">'+X(t[1])+(cnt[t[0]]?' ('+cnt[t[0]]+')':'')+'</button>';}).join('')+'</div>'+(ERR?'<div class="card" style="border-color:var(--red)"><b>Could not load data:</b> '+X(ERR)+'<div class="m">Open Supabase → SQL Editor and run <b>hive2.sql</b> (the whole file), then press Unlock again.</div></div>':'')+VIEW[tab]()+'</div>';window.scrollTo(0,sy);}
async function toggleSet(w,btn){var s=LF.settings||{},n={signups_open:s.signups_open!==false,require_approval:!!s.require_approval};
  if(w==='signups'){n.signups_open=!n.signups_open;if(n.signups_open&&!confirm('Allow anyone to create an account?\n\nHIVE is meant for students created by you. Only switch this ON if you really want open sign-up.'))return;}else n.require_approval=!n.require_approval;
  await lf('set_settings',n,w==='signups'?(n.signups_open?'Self sign-up is now ON':'🔒 Self sign-up is now OFF'):(n.require_approval?'⏳ Approval is now required':'Approval no longer required'),btn);}
async function approveAll(btn){var n=LF.users.filter(function(u){return st(u)==='pending';}).length;if(!n||!confirm('Approve all '+n+' pending user(s)?'))return;await lf('approve_all',{},'✅ Approved '+n+' user(s)',btn);}
async function delItem(btn){if(!confirm('Permanently delete "'+btn.dataset.name+'"?\n\nThis cannot be undone.'))return;await lf('delete_item',{id:btn.dataset.id},'🗑 Item deleted',btn);}
async function addU(){var u=V('ce').trim().toLowerCase(),p={name:V('cn').trim(),email:u,roll_no:V('cr').trim(),password:V('cp')};if(!p.name||!u){toast('Name and username are required');return;}
  if(!/^[a-z0-9._+-]+(@[a-z0-9.-]+\.[a-z]{2,})?$/.test(u)){toast('Username: letters, numbers . _ - only');return;}if(u.indexOf('@')<0)p.email=u+'@hive.local';
  if(await act('create_user',p,'Student created')){tmp='Student: '+p.name+'\nUsername: '+u.replace('@hive.local','')+'\nPassword: '+p.password;draw();}}
async function resetP(id){var pw=V('p'+id);if(await act('set_password',{user_id:id,password:pw},'Password reset')){tmp='New temporary password: '+pw+'\n(give it to the student)';tab='students';draw();}}
function saveAtt(id){var rows=D.subjects.map(function(b){return {code:b.code,attended:+V('a'+id+b.code)||0,total:+V('t'+id+b.code)||0};});act('set_attendance',{user_id:id,rows:rows},'Attendance saved');}
function dec(id,s){var n=V('n'+id).trim();if((s==='questioned'||s==='denied')&&!n){toast('Add a note for the student');return;}act('decide_leave',{id:id,status:s,note:n},'Leave '+s);}
function pst(id,st){cdo('post_status',{id:id,status:st,note:V('cn'+id).trim()},st==='resolved'?'Marked resolved':st==='hidden'?'Post hidden':'Post visible');}
function addEp(){var t=V('ept').trim(),u=V('epu').trim();if(t.length<3){toast('Add an episode title');return;}if(!/^https:\/\/\S+$/i.test(u)){toast('The link must start with https://');return;}cdo('add_episode',{title:t,guest:V('epg'),url:u,description:V('epd')},'Episode published');}
function addCl(){var n=V('cln').trim();if(n.length<2){toast('Add a club name');return;}cdo('add_club',{name:n,emoji:V('cle').trim(),description:V('cld').trim()},'Club added');}
function postA(){var t=V('at').trim(),b=V('ab').trim();if(!t||!b){toast('Add a headline and details');return;}act('post_ann',{title:t,body:b,category:V('ac'),priority:V('ap'),pinned:$('apn').checked},'Published');}
function addE(){if(!V('ed')||!V('et').trim()){toast('Add a date and title');return;}act('add_event',{date:V('ed'),title:V('et').trim(),kind:V('ek')},'Event added');}
function saveS(c){act('set_subject',{code:c,description:V('sd'+c),syllabus:V('ss'+c).split('\n').map(function(x){return x.trim();}).filter(Boolean).join('|'),faculty:V('sf'+c)},'Subject saved');}
loginView();
</script></body></html>
