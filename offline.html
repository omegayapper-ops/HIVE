<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#7C3AED">
<title>Offline — Lost &amp; Found</title>
<style>
  html,body{height:100%;margin:0}
  body{display:flex;align-items:center;justify-content:center;text-align:center;
       background:radial-gradient(ellipse at 50% 0%,#32164A 0%,#100D18 70%);color:#F7F1FF;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
       padding:env(safe-area-inset-top) 24px env(safe-area-inset-bottom)}
  img{width:96px;height:96px;margin-bottom:18px}
  h1{font-size:22px;margin:0 0 8px}
  p{margin:0 0 22px;color:#B4A9C7;line-height:1.5;max-width:320px}
  button{background:linear-gradient(135deg,#7C3AED,#5B21B6);color:#fff;border:0;border-radius:12px;padding:12px 28px;font-size:16px;font-weight:600}
</style>
</head>
<body>
  <main>
    <img src="icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Lost &amp; Found needs an internet connection to load items. Check your connection and try again.</p>
    <button onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
